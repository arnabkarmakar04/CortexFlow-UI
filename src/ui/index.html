<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#212121"><title>CortexFlow</title>
<link rel="stylesheet" href="/ui/styles.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="brand-row"><a class="brand" href="/" aria-label="CortexFlow home"><span class="logo">C</span><span>CortexFlow</span></a><button class="icon mobile-only" id="closeSidebar" aria-label="Close menu">×</button></div>
    <button class="new-chat" id="newChat"><span>＋</span> New chat</button>
    <div class="section-label">YOUR CHATS</div><nav id="chatList" class="chat-list"></nav>
    <div class="sidebar-bottom"><div class="user-avatar">CF</div><div class="user-meta"><strong>CortexFlow</strong><small>Local workspace</small></div><span class="online-dot"></span></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <header class="topbar"><div class="top-left"><button class="icon mobile-only" id="openSidebar" aria-label="Open menu">☰</button><span class="model-dot"></span><strong>CortexFlow</strong><span class="muted">AI Assistant</span></div><button class="icon" id="clearChat" title="Clear this conversation" aria-label="Clear conversation">↻</button></header>
    <section class="scroll-area" id="scrollArea">
      <div class="welcome" id="welcome"><div class="welcome-logo">C</div><h1>What can I help with?</h1><p>Ask a question and CortexFlow will work through it with you.</p>
        <div class="suggestions">
          <button class="suggestion" data-prompt="Help me understand an agentic AI workflow."><span class="suggestion-icon">⌘</span><span><b>Explore agentic AI</b><small>Understand agents and workflows</small></span><span class="arrow">↗</span></button>
          <button class="suggestion" data-prompt="Help me debug a Python error."><span class="suggestion-icon">⌁</span><span><b>Debug a problem</b><small>Work through an error</small></span><span class="arrow">↗</span></button>
          <button class="suggestion" data-prompt="Explain how LangGraph state and nodes work together."><span class="suggestion-icon">◈</span><span><b>Understand LangGraph</b><small>Explore state and nodes</small></span><span class="arrow">↗</span></button>
          <button class="suggestion" data-prompt="Help me plan a solution to a complex task."><span class="suggestion-icon">✳</span><span><b>Plan a solution</b><small>Break a task into steps</small></span><span class="arrow">↗</span></button>
        </div>
      </div>
      <div class="messages" id="messages" aria-live="polite"></div>
    </section>
    <footer class="composer-area"><form class="composer" id="chatForm"><textarea id="prompt" rows="1" placeholder="Message CortexFlow" aria-label="Message CortexFlow"></textarea><div class="composer-footer"><span id="status">Enter to send · Shift+Enter for a new line</span><button id="send" class="send" type="submit" aria-label="Send message">↑</button></div></form><p class="footnote">CortexFlow may make mistakes. Verify important information.</p></footer>
  </main>
</div>
<script src="/ui/app.js" defer></script>
</body></html>
