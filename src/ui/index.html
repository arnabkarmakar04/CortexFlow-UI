<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#212121">
  <meta name="description" content="CortexFlow AI assistant">
  <title>CortexFlow</title>
  <link rel="stylesheet" href="/ui/styles.css">
  <script src="/ui/app.js" defer></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Conversation sidebar">
      <div class="brand-row">
        <a class="brand" href="/" aria-label="CortexFlow home">
          <span class="logo" aria-hidden="true">C</span>
          <span>CortexFlow</span>
        </a>
        <button class="icon mobile-only" id="closeSidebar" type="button" aria-label="Close menu">×</button>
      </div>
      <button class="new-chat" id="newChat" type="button"><span aria-hidden="true">＋</span> New chat</button>
      <div class="section-label">YOUR CHATS</div>
      <nav id="chatList" class="chat-list" aria-label="Conversations"></nav>
      <div class="sidebar-bottom">
        <div class="user-avatar" aria-hidden="true">CF</div>
        <div class="user-meta"><strong>CortexFlow</strong><small>Local workspace</small></div>
        <span class="online-dot" aria-label="Online"></span>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <main class="main">
      <header class="topbar">
        <div class="top-left">
          <button class="icon mobile-only" id="openSidebar" type="button" aria-label="Open menu" aria-expanded="false">☰</button>
          <span class="model-dot" aria-hidden="true"></span>
          <strong>CortexFlow</strong>
          <span class="muted">AI Assistant</span>
        </div>
        <button class="icon" id="clearChat" type="button" title="Clear this conversation" aria-label="Clear conversation">↻</button>
      </header>
      <section class="scroll-area" id="scrollArea" aria-label="Conversation">
        <div class="welcome" id="welcome">
          <div class="welcome-logo" aria-hidden="true">C</div>
          <h1>What can I help with?</h1>
          <p>Ask a question and CortexFlow will work through it with you.</p>
          <div class="suggestions" aria-label="Suggested prompts">
            <button class="suggestion" type="button" data-prompt="Help me understand an agentic AI workflow.">
              <span class="suggestion-icon" aria-hidden="true">⌘</span>
              <span><b>Explore agentic AI</b><small>Understand agents and workflows</small></span>
              <span class="arrow" aria-hidden="true">↗</span>
            </button>
            <button class="suggestion" type="button" data-prompt="Help me debug a Python error.">
              <span class="suggestion-icon" aria-hidden="true">⌁</span>
              <span><b>Debug a problem</b><small>Work through an error</small></span>
              <span class="arrow" aria-hidden="true">↗</span>
            </button>
            <button class="suggestion" type="button" data-prompt="Explain how LangGraph state and nodes work together.">
              <span class="suggestion-icon" aria-hidden="true">◈</span>
              <span><b>Understand LangGraph</b><small>Explore state and nodes</small></span>
              <span class="arrow" aria-hidden="true">↗</span>
            </button>
            <button class="suggestion" type="button" data-prompt="Help me plan a solution to a complex task.">
              <span class="suggestion-icon" aria-hidden="true">✳</span>
              <span><b>Plan a solution</b><small>Break a task into steps</small></span>
              <span class="arrow" aria-hidden="true">↗</span>
            </button>
          </div>
        </div>
        <div class="messages" id="messages" aria-live="polite" aria-relevant="additions text"></div>
      </section>
      <footer class="composer-area">
        <form class="composer" id="chatForm">
          <textarea id="prompt" rows="1" placeholder="Message CortexFlow" aria-label="Message CortexFlow" autocomplete="off"></textarea>
          <div class="composer-footer">
            <span id="status">Enter to send · Shift+Enter for a new line</span>
            <button id="send" class="send" type="submit" aria-label="Send message">↑</button>
          </div>
        </form>
        <p class="footnote">CortexFlow may make mistakes. Verify important information.</p>
      </footer>
    </main>
  </div>
</body>
</html>
